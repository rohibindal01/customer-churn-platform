[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-platform"
version = "0.1.0"
description = "Customer churn prediction and retention intelligence platform"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/churn", "app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1